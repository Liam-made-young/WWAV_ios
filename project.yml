name: WWAV
options:
  bundleIdPrefix: com.wwav
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  WWAV:
    type: application
    platform: iOS
    sources:
      - path: WWAV
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: WWAV/Resources/Assets.xcassets
        optional: true
    info:
      path: WWAV/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: "WWAV records new tracks for stem separation."
        # Keeps audio playing when the app is backgrounded or the screen is
        # locked, and surfaces lock-screen / Control Center transport controls.
        UIBackgroundModes:
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: "wwav"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wwav.app
        PRODUCT_NAME: WWAV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
  WWAVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WWAVTests
    dependencies:
      - target: WWAV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wwav.app.tests
        GENERATE_INFOPLIST_FILE: YES
